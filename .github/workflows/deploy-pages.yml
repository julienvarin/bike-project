name: Deploy to GitHub Pages

# Publishes the static site (index.html + images/) to GitHub Pages.
# `configure-pages` with enablement:true turns Pages on automatically using the
# workflow's own token, so no manual Settings step is needed once the repo is
# public. Runs on every push to the site branch, and can be triggered manually.

on:
  push:
    branches: ["claude/github-pages-deploy-yu731y", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
